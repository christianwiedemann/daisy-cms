# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human-readable name.
name: Grid Section

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

props:
  type: object
  properties:
    display_header_region:
      type: boolean
      label: Display header region
    theme:
      type: string
      label: Theme
      enum:
        - bg-primary
        - bg-secondary
    gutter:
      type: string
      title: Gutter
      default_value: default
      description: The gutter between the cells.
      enum:
        - none
        - small
        - default
        - large
      meta:enum:
        none: None
        small: Small
        default: Default
        large: Large
    grid_layout:
      type: string
      label: Grid Layout
      description: Use "grid_layout" when you embed grid direct in code.
      enum:
        - 1_equal
        - 2_equal
        - 2_66x33
        - 2_33x66
        - 2_75x25
        - 2_25x75
        - 3_equal
        - 3_25x50x25
        - 2_25x25x50
        - 4_equal
        - 5_equal

# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  header:
    type: pattern
    label: Section Header
    description: Optional header
  column_1:
    type: text
    label: First Column
    preview:
      faker: lorem.paragraph
  column_2:
    type: text
    label: Second Column
    preview:
      faker: lorem.paragraph
  column_3:
    type: text
    label: Third Column
    preview:
      faker: lorem.paragraph
  column_4:
    type: text
    label: Fourth Column
    preview:
      faker: lorem.paragraph
  column_5:
    type: text
    label: Five Column
    preview:
      faker: lorem.paragraph

